log:
  level: info
runner:
  file: /var/lib/fantasyperf-runner/.runner
  capacity: 1
  timeout: 20m
  labels:
    - fantasyperf-ci:docker://mcr.microsoft.com/playwright:v1.63.0-noble
cache:
  enabled: false
container:
  privileged: false
  options: --memory=4g --cpus=2 --pids-limit=1024
  valid_volumes: []
  docker_host: '-'
  force_pull: false
