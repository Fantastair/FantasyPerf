server {
    listen 4096;
    server_name _;
    root /srv/fantasyperf/current;
    index index.html;
    charset utf-8;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    location / { try_files $uri $uri/ =404; }
    location ~ /\. { return 404; }
    access_log /www/wwwlogs/fantasyperf.access.log;
    error_log /www/wwwlogs/fantasyperf.error.log;
}
