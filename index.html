<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>FantasyPerf · 洞洞板工作台</title>
    <meta
      name="description"
      content="以孔位和引脚标注为核心的洞洞板布局工具，支持正反面布线，可导出元件与跳线清单。"
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230b766d'/%3E%3Cg fill='%23fff'%3E%3Ccircle cx='9' cy='9' r='2'/%3E%3Ccircle cx='23' cy='9' r='2'/%3E%3Ccircle cx='9' cy='23' r='2'/%3E%3Ccircle cx='23' cy='23' r='2'/%3E%3C/g%3E%3Cpath d='M9 9v14h14' fill='none' stroke='%23fff' stroke-width='2'/%3E%3C/svg%3E"
    />
    <script src="./src/theme.js"></script>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <header class="header">
      <a class="brand" href="./" aria-label="FantasyPerf 首页"
        ><span class="brand-icon">⠿</span
        ><span
          >Fantasy<span class="brand-light">Perf</span
          ><small>洞洞板工作台</small></span
        ></a
      >
      <span class="divider"></span
      ><input
        id="project-name"
        aria-label="项目名称"
        value="未命名项目"
        maxlength="100"
      /><span id="save-status" class="save-status" role="status"
        >本机自动保存</span
      >
      <nav class="file-actions" aria-label="项目操作">
        <select id="theme-mode" aria-label="外观模式" title="外观模式">
          <option value="system">跟随系统</option>
          <option value="light">浅色模式</option>
          <option value="dark">深色模式</option>
        </select>
        <button data-action="new">新建</button
        ><button data-action="open">打开</button
        ><button data-action="export" class="primary">
          导出 <span>↗</span>
        </button>
      </nav>
    </header>
    <div class="commandbar">
      <div class="history">
        <button data-action="undo" title="撤销 · Ctrl / ⌘ Z" aria-label="撤销">
          ↶</button
        ><button
          data-action="redo"
          title="重做 · Ctrl / ⌘ Shift Z"
          aria-label="重做"
        >
          ↷</button
        ><span class="divider"></span
        ><span id="summary">30 × 20 孔 · 2.54 mm</span>
      </div>
      <div class="segmented" role="group" aria-label="板面视图">
        <button data-view="front" class="active">
          元件面 <small>正面</small></button
        ><button data-view="back">焊盘面 <small>背面</small></button
        ><button data-view="split">并排核对</button>
      </div>
      <button data-action="help" class="help-button">
        ? <span>操作指南</span>
      </button>
    </div>
    <main class="workspace">
      <aside class="tools" aria-label="绘图工具">
        <button data-tool="select" class="tool active" title="选择 · V">
          <span>↖</span>选择<kbd>V</kbd>
        </button>
        <button data-tool="component" class="tool" title="放置元件 · C">
          <span>▦</span>元件<kbd>C</kbd>
        </button>
        <button data-tool="solder" class="tool" title="焊盘面锡线 · S">
          <span>⌁</span>锡线<kbd>S</kbd>
        </button>
        <button data-tool="wire" class="tool" title="元件面跳线 · W">
          <span>⌒</span>跳线<kbd>W</kbd>
        </button>
        <button class="tool" data-action="reference" title="导入原理图图片">
          <span>▧</span>参考图
        </button>
        <button
          class="tool"
          data-action="smd"
          title="放置焊盘面贴片电阻 / 电容"
        >
          <span>▰</span>贴片
        </button>
        <div class="tools-bottom">
          <button data-action="fit" title="适合窗口 · F" aria-label="适合窗口">
            ⛶</button
          ><button
            data-action="demo"
            title="打开示例项目"
            aria-label="打开示例项目"
          >
            ◈
          </button>
        </div>
      </aside>
      <section class="stage" aria-label="洞洞板编辑画布">
        <div class="stage-top">
          <span class="view-badge" id="view-label" hidden>正面 · 元件面</span
          ><span id="mode-options"></span
          ><span class="stage-note" id="stage-note"
            >左右翻板，孔位编号保持不变</span
          >
        </div>
        <canvas
          id="board"
          tabindex="0"
          aria-label="洞洞板画布。使用左侧工具添加元件和线路，操作指南提供键盘快捷键。"
        ></canvas>
        <div class="empty-tip" id="empty-tip">
          <span class="eyebrow">从一组引脚开始</span>
          <h1>让每个连接，落在对的孔位。</h1>
          <p>放置元件，标好引脚，再安排锡线与跳线。</p>
          <button data-tool="component" class="primary">
            ＋ 放置第一个元件</button
          ><button data-action="demo">查看示例</button>
        </div>
        <div class="viewer-welcome" id="viewer-welcome" hidden>
          <h1>查看布线图</h1>
          <p>打开电脑导出的项目文件，单指拖动、双指缩放。</p>
          <button data-action="open" class="primary">打开项目</button
          ><button data-action="viewer-demo">查看示例</button>
        </div>
        <div class="viewer-actions">
          <span>只读查看</span><button data-action="viewer-details">详情</button
          ><button data-action="viewer-wires">跳线清单</button
          ><button data-action="viewer-reference">参考图</button>
        </div>
        <div class="canvas-bottom">
          <span id="selection-hint">孔距 2.54 mm</span>
          <div class="zoom-controls">
            <button data-action="zoom-out" aria-label="缩小">−</button
            ><button data-action="fit" id="zoom-label">100%</button
            ><button data-action="zoom-in" aria-label="放大">＋</button>
          </div>
        </div>
      </section>
      <aside class="inspector">
        <div class="panel-tabs">
          <button
            class="viewer-close"
            data-action="viewer-close"
            aria-label="收起详情"
          >
            ×
          </button>
          <button data-panel="properties" class="active">属性</button
          ><button data-panel="wires">
            跳线清单 <span id="wire-count">0</span>
          </button>
        </div>
        <div id="inspector-content"></div>
        <div class="panel-foot">
          <span class="tiny-board">▦</span>
          <div>
            自由布局，按孔位连接<small>线路不会跟随单独移动的元件</small>
          </div>
        </div>
      </aside>
    </main>
    <footer>
      <span class="status-dot"></span><span id="status-face">元件面</span
      ><span class="footer-divider">/</span><span id="hole-position">—</span
      ><span id="status-hint">点击选择 · 拖动框选 · 空格拖动平移</span
      ><span class="local-label">仅保存在此浏览器</span>
    </footer>
    <dialog id="modal"><div id="modal-content"></div></dialog>
    <input
      type="file"
      id="file-input"
      accept=".json,.fantasyperf,application/json"
      hidden
    />
    <input type="file" id="component-file-input" accept=".json,application/json" hidden />
    <div id="toast" role="status" aria-live="polite"></div>
    <script type="module" src="./src/app.js"></script>
  </body>
</html>
