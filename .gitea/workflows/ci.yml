name: FantasyPerf CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  verify:
    name: verify
    # Register this label on a container runner with Playwright 1.63.0 / Noble.
    # Do not map it to the existing linux:host runner.
    runs-on: fantasyperf-ci
    steps:
      - name: Checkout
        uses: https://github.com/actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install dependencies
        run: npm ci
      - name: Unit tests
        run: npm test
      - name: Browser tests
        run: npm run test:e2e
      - name: Build
        run: npm run build
